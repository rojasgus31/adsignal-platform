[project]
name = "adsignal"
version = "0.1.0"
description = "Ad campaign intelligence data platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyarrow>=18.0",
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "mlflow>=2.17",
    "pgvector>=0.3",
    "fastembed>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsignal"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
