name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adsignal
          POSTGRES_PASSWORD: adsignal
          POSTGRES_DB: adsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Install dbt packages
        run: uv run dbt deps --project-dir dbt --profiles-dir dbt

      - name: Test
        env:
          # A separate database on the same service, never the serving
          # "adsignal" database - the suite truncates ML tables and does a
          # full mart refresh (see conftest.py's `_ensure_test_database`, I2).
          ADSIGNAL_TEST_DSN: postgresql://adsignal:adsignal@localhost:5432/adsignal_test
        run: uv run pytest -v
